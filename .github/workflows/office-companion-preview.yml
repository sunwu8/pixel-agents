name: Office Companion Mobile Preview

on:
  push:
    branches:
      - dev/mobile-office-v1
    paths:
      - 'companion/**'
      - 'webview-ui/public/office.png'
      - '.github/workflows/office-companion-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-companion-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare self-contained preview
        shell: bash
        run: |
          mkdir -p _site
          cp companion/index.html companion/github-feed.js _site/
          cp webview-ui/public/office.png _site/office.png
          sed -i 's|../webview-ui/public/office.png|./office.png|g' _site/index.html
          grep -q 'src="./office.png"' _site/index.html
          grep -q 'github-feed.js' _site/index.html
          test -s _site/office.png
          test -s _site/github-feed.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
