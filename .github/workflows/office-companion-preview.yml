name: Office Companion Mobile Preview

on:
  push:
    branches:
      - dev/mobile-office-v1
    paths:
      - 'companion/**'
      - 'webview-ui/public/office.png'
      - '.github/workflows/office-companion-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-companion-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Prepare browser demo and downloadable artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standalone demo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp companion/index.html companion/github-feed.js _site/
          cp webview-ui/public/office.png _site/office.png
          sed -i 's|../webview-ui/public/office.png|./office.png|g' _site/index.html
          grep -q 'src="./office.png"' _site/index.html
          grep -q 'src="./github-feed.js"' _site/index.html
          test -s _site/index.html
          test -s _site/office.png
          test -s _site/github-feed.js
      - name: Upload standalone demo (no Pages required)
        uses: actions/upload-artifact@v4
        with:
          name: office-mobile-demo
          path: _site/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish demo to GitHub Pages
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: office-mobile-demo
          path: _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
